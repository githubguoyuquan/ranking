{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ranking.fullname" . }}-api
  labels:
    {{- include "ranking.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "ranking.labels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "ranking.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- if .Values.monitoring.prometheusScrape }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.service.port | quote }}
        prometheus.io/path: "/admin/observability/prometheus"
      {{- end }}
    spec:
      {{- if .Values.global.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.global.topologySpread.maxSkew }}
          topologyKey: {{ .Values.global.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.global.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/main.js"]
          env:
            {{- $ctx := dict "Values" .Values "processRole" .Values.api.processRole }}
            {{- include "ranking.coreEnv" $ctx | nindent 12 }}
          {{- $envFrom := include "ranking.envFrom" . | trim }}
          {{- if $envFrom }}
          envFrom:
            {{- include "ranking.envFrom" . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          {{- $probeCtx := dict "Values" .Values "port" .Values.api.service.port }}
          {{- include "ranking.httpProbes" $probeCtx | nindent 10 }}
          resources:
            {{- toYaml (.Values.api.resources | default .Values.resources) | nindent 12 }}
{{- end }}
