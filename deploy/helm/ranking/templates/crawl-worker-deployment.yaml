{{- if .Values.crawlWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ranking.fullname" . }}-crawl-worker
  labels:
    {{- include "ranking.labels" . | nindent 4 }}
    app.kubernetes.io/component: crawl-worker
spec:
  replicas: {{ .Values.crawlWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "ranking.labels" . | nindent 6 }}
      app.kubernetes.io/component: crawl-worker
  template:
    metadata:
      labels:
        {{- include "ranking.labels" . | nindent 8 }}
        app.kubernetes.io/component: crawl-worker
    spec:
      containers:
        - name: crawl-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/crawl-worker.main.js"]
          env:
            - name: PROCESS_ROLE
              value: {{ .Values.crawlWorker.processRole | quote }}
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
