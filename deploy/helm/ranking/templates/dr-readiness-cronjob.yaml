{{- if .Values.drReadinessCron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ranking.fullname" . }}-dr-readiness
  labels:
    {{- include "ranking.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.drReadinessCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: dr-readiness
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/bash
                - /app/scripts/dr-readiness.sh
                - --min-status={{ .Values.drReadinessCron.minStatus | default "warn" }}
              env:
                - name: RANKING_API_BASE
                  value: {{ .Values.drReadinessCron.apiBase | quote }}
                - name: RANKING_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: {{ .Values.drReadinessCron.apiKeySecretKey | default "RANKING_ADMIN_API_KEY" }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
{{- end }}
