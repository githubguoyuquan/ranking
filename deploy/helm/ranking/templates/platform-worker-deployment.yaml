{{- if .Values.platformWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ranking.fullname" . }}-platform-worker
  labels:
    {{- include "ranking.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-worker
spec:
  replicas: {{ .Values.platformWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "ranking.labels" . | nindent 6 }}
      app.kubernetes.io/component: platform-worker
  template:
    metadata:
      labels:
        {{- include "ranking.labels" . | nindent 8 }}
        app.kubernetes.io/component: platform-worker
    spec:
      {{- if .Values.global.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.global.topologySpread.maxSkew }}
          topologyKey: {{ .Values.global.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.global.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: platform-worker
      {{- end }}
      containers:
        - name: platform-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/platform-worker.main.js"]
          env:
            {{- $ctx := dict "Values" .Values "processRole" .Values.platformWorker.processRole }}
            {{- include "ranking.coreEnv" $ctx | nindent 12 }}
          {{- $envFrom := include "ranking.envFrom" . | trim }}
          {{- if $envFrom }}
          envFrom:
            {{- include "ranking.envFrom" . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml (.Values.platformWorker.resources | default .Values.resources) | nindent 12 }}
{{- end }}
