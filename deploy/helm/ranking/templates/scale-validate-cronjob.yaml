{{- if .Values.scaleValidateCron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ranking.fullname" . }}-scale-validate
  labels:
    {{- include "ranking.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scaleValidateCron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: scale-validate
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/bash
                - /app/scripts/scale-validate.sh
                - --min-status={{ .Values.scaleValidateCron.minStatus | default "warn" }}
              env:
                - name: RANKING_API_BASE
                  value: {{ .Values.scaleValidateCron.apiBase | quote }}
                - name: RANKING_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secret.name }}
                      key: {{ .Values.scaleValidateCron.apiKeySecretKey | default "RANKING_ADMIN_API_KEY" }}
                {{- if .Values.scaleValidateCron.alertOnFailure }}
                - name: DR_ALERT_ON_FAILURE
                  value: "true"
                {{- end }}
                {{- include "ranking.alertEnv" . | nindent 16 }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
{{- end }}
