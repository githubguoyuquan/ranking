# AWS 生产接线参考（与 values-production.yaml 叠加）
# helm upgrade --install ranking deploy/helm/ranking \
#   -f deploy/helm/ranking/values-production.yaml \
#   -f deploy/helm/ranking/values-aws-production.yaml \
#   --set externalSecrets.enabled=true

global:
  topologySpread:
    enabled: true

productionWiring:
  required: true

dr:
  region: "ap-southeast-1"
  cluster: "prod-eks"

secret:
  enabled: true
  name: ranking-env

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: prod/ranking/rds
        property: writer_url
    - secretKey: DATABASE_READ_URL
      remoteRef:
        key: prod/ranking/rds
        property: reader_url
    - secretKey: REDIS_URL
      remoteRef:
        key: prod/ranking/elasticache
        property: url
    - secretKey: KAFKA_BROKERS
      remoteRef:
        key: prod/ranking/msk
        property: bootstrap_brokers
    - secretKey: KAFKA_SCHEMA_REGISTRY_URL
      remoteRef:
        key: prod/ranking/msk
        property: schema_registry_url
    - secretKey: ELASTICSEARCH_NODE
      remoteRef:
        key: prod/ranking/search
        property: elasticsearch_node
    - secretKey: CLICKHOUSE_URL
      remoteRef:
        key: prod/ranking/clickhouse
        property: url
    - secretKey: QDRANT_URL
      remoteRef:
        key: prod/ranking/qdrant
        property: url
    - secretKey: ALERT_WEBHOOK_URL
      remoteRef:
        key: prod/ranking/alerts
        property: webhook_url
    - secretKey: ALERT_WEBHOOK_BEARER_TOKEN
      remoteRef:
        key: prod/ranking/alerts
        property: bearer_token
    - secretKey: PAGERDUTY_ROUTING_KEY
      remoteRef:
        key: prod/ranking/alerts
        property: pagerduty_routing_key
    - secretKey: RANKING_ADMIN_API_KEY
      remoteRef:
        key: prod/ranking/admin
        property: api_key

drReadinessCron:
  enabled: true
  schedule: "*/15 * * * *"
  apiBase: "http://ranking-ranking-api:3000"
  minStatus: warn
  apiKeySecretKey: RANKING_ADMIN_API_KEY
  alertOnFailure: true

scaleValidateCron:
  enabled: true
  schedule: "0 4 * * 1"
  apiBase: "http://ranking-ranking-api:3000"
  minStatus: warn
  alertOnFailure: true

drQuarterlyDrill:
  enabled: true
  schedule: "0 3 1 1,4,7,10 *"
  apiBase: "http://ranking-ranking-api:3000"
  minStatus: warn

alerts:
  # 明文 routes 示例；生产可改由 ALERT_WEBHOOK_ROUTES secret 覆盖
  webhookRoutes: '{"default":"https://hooks.slack.com/services/REPLACE/slack","critical":"https://events.pagerduty.com/v2/enqueue","categories":{"trends":"https://hooks.slack.com/services/REPLACE/trends"}}'
  format: json
  cooldownSeconds: 300

env:
  API_AUTH_REQUIRED: "true"
  DATABASE_URL: ""
  DATABASE_READ_URL: ""
  REDIS_URL: ""
  KAFKA_BROKERS: ""
  KAFKA_SCHEMA_REGISTRY_URL: ""
  ELASTICSEARCH_NODE: ""
  CLICKHOUSE_URL: ""
  QDRANT_URL: ""
  extra:
    SCALE_VALIDATE_ES_P95_MS: "500"
    SCALE_VALIDATE_QDRANT_P95_MS: "300"
    DR_ALERT_ON_FAILURE: "true"
