# AWS 生产接线参考（与 values-production.yaml 叠加）
# helm upgrade --install ranking deploy/helm/ranking \
#   -f deploy/helm/ranking/values-production.yaml \
#   -f deploy/helm/ranking/values-aws-production.yaml \
#   --set externalSecrets.enabled=true

global:
  topologySpread:
    enabled: true

productionWiring:
  required: true

dr:
  region: "ap-southeast-1"
  cluster: "prod-eks"

# 敏感项由 External Secrets 注入 K8s Secret `ranking-env`
secret:
  enabled: true
  name: ranking-env

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  # AWS Secrets Manager JSON 键 → 应用 env
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: prod/ranking/rds
        property: writer_url
    - secretKey: DATABASE_READ_URL
      remoteRef:
        key: prod/ranking/rds
        property: reader_url
    - secretKey: REDIS_URL
      remoteRef:
        key: prod/ranking/elasticache
        property: url
    - secretKey: KAFKA_BROKERS
      remoteRef:
        key: prod/ranking/msk
        property: bootstrap_brokers
    - secretKey: KAFKA_SCHEMA_REGISTRY_URL
      remoteRef:
        key: prod/ranking/msk
        property: schema_registry_url

drReadinessCron:
  enabled: true
  schedule: "*/15 * * * *"
  # 集群内探测 API Service
  apiBase: "http://ranking-ranking-api:3000"
  minStatus: warn
  # 从同一 Secret 读取 admin key
  apiKeySecretKey: RANKING_ADMIN_API_KEY

env:
  API_AUTH_REQUIRED: "true"
  # 明文 values 留空 — 由 secretRef 提供；PRODUCTION_WIRING_REQUIRED 由 productionWiring.required 注入
  DATABASE_URL: ""
  DATABASE_READ_URL: ""
  REDIS_URL: ""
  KAFKA_BROKERS: ""
  KAFKA_SCHEMA_REGISTRY_URL: ""
  extra: {}

# 生产 AWS 接线见 docs/ops/AWS_PRODUCTION_WIRING.md 与 values-aws-production.yaml
# DATABASE_URL=postgresql://app:***@ranking.cluster-xxxx.ap-southeast-1.rds.amazonaws.com:5432/ranking?sslmode=require
# DATABASE_READ_URL=postgresql://app:***@ranking.cluster-ro-xxxx.ap-southeast-1.rds.amazonaws.com:5432/ranking?sslmode=require
# REDIS_URL=rediss://:auth-token@ranking.xxxxx.ng.0001.apse1.cache.amazonaws.com:6379
# KAFKA_BROKERS=b-1.xxx.kafka.ap-southeast-1.amazonaws.com:9098,b-2.xxx.kafka.ap-southeast-1.amazonaws.com:9098
