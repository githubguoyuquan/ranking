# 生产 / 多 AZ 参考值（按集群调整）
global:
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

api:
  enabled: true
  replicaCount: 3
  processRole: api
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

platformWorker:
  enabled: true
  replicaCount: 2
  processRole: worker

crawlWorker:
  enabled: true
  replicaCount: 2
  processRole: crawl

web:
  enabled: true
  replicaCount: 2
  apiBaseUrl: "https://api.ranking.example.com"

hpa:
  api:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 65

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "80"
    nginx.ingress.kubernetes.io/limit-rpm: "2400"
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: ranking.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /v1
          pathType: Prefix
          service: api
        - path: /admin
          pathType: Prefix
          service: api
        - path: /health
          pathType: Prefix
          service: api

monitoring:
  prometheusScrape: true
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: prometheus

dr:
  region: "ap-southeast-1"
  cluster: "prod-eks"

pdb:
  enabled: true
  minAvailable: 1

env:
  API_AUTH_REQUIRED: "true"
  KAFKA_BROKERS: ""
  KAFKA_SCHEMA_REGISTRY_URL: ""
  DATABASE_URL: ""
  DATABASE_READ_URL: ""
  REDIS_URL: ""
