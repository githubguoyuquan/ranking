global:
  topologySpread:
    enabled: false
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

image:
  repository: ranking-platform
  tag: "0.1.0"
  pullPolicy: IfNotPresent

dr:
  region: ""
  cluster: ""

probes:
  livenessPath: /health
  readinessPath: /health/ready
  startupPath: /health/ready
  readinessInitialDelaySeconds: 10
  readinessPeriodSeconds: 10
  livenessInitialDelaySeconds: 30
  livenessPeriodSeconds: 15
  startupFailureThreshold: 30
  startupPeriodSeconds: 5

api:
  enabled: true
  replicaCount: 2
  processRole: api
  service:
    port: 3000

platformWorker:
  enabled: true
  replicaCount: 1
  processRole: worker

crawlWorker:
  enabled: false
  replicaCount: 1
  processRole: crawl
  extraEnv: {}

crawlWorkerRegions: []

migrateJob:
  enabled: false
  backoffLimit: 2

web:
  enabled: false
  replicaCount: 1
  apiBaseUrl: "http://ranking-api:3000"
  image:
    repository: ranking-web
    tag: "0.1.0"
  service:
    port: 3001
  extraEnv: {}

hpa:
  api:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: false
  className: nginx
  annotations: {}
  tls: []
  hosts:
    - host: ranking.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /v1
          pathType: Prefix
          service: api
        - path: /admin
          pathType: Prefix
          service: api
        - path: /health
          pathType: Prefix
          service: api

monitoring:
  prometheusScrape: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

config:
  enabled: false
  data: {}

secret:
  enabled: false
  name: ranking-env

pdb:
  enabled: true
  minAvailable: 1

env:
  DATABASE_URL: ""
  DATABASE_READ_URL: ""
  REDIS_URL: ""
  API_AUTH_REQUIRED: "true"
  KAFKA_BROKERS: ""
  KAFKA_SCHEMA_REGISTRY_URL: ""
  extra: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
