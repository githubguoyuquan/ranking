openapi: 3.0.3
info:
  title: Ranking platform — Crawl Scheduler Admin (fragment)
  description: |
    全球爬虫调度运维 API。实现：`src/ingestion/crawl-scheduler-admin.controller.ts`。
  version: 0.1.0

servers:
  - url: http://localhost:3000

tags:
  - name: Crawl
  - name: Admin

paths:
  /admin/crawl/scheduler/status:
    get:
      tags: [Crawl, Admin]
      summary: 调度器运行状态
      operationId: adminCrawlSchedulerStatus
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: enabled、region、lastTick 等

  /admin/crawl/scheduler/tick:
    post:
      tags: [Crawl, Admin]
      summary: 手动触发一轮调度
      operationId: adminCrawlSchedulerTick
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: 已执行 tick

  /admin/crawl/scheduler/runs:
    get:
      tags: [Crawl, Admin]
      summary: 近期调度审计
      operationId: adminCrawlSchedulerRuns
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: runs 列表

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
